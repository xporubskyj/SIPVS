<html>
  <head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Objednávka</title>
    <style>
					body { font-family: Arial, sans-serif; background: #eee; }
					.paper { width: 700px; margin: 20px auto; padding: 40px; background: #fff; border: 1px solid #999; }
					h1 { text-align: center; letter-spacing: 4px; }
					table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
					th, td { border: 1px solid #000; padding: 6px; text-align: left; }
					.number { text-align: right; }
					.signature { margin-top: 60px; text-align: right; }
				</style>
  </head>
  <body>
    <div class="paper">
      <h1>OBJEDNÁVKA</h1>
      <table>
        <tr>
          <th>Odberateľ</th>
          <td>kkt</td>
        </tr>
        <tr>
          <th>E-mail</th>
          <td>kkt@gmail.com</td>
        </tr>
        <tr>
          <th>Dátum objednávky</th>
          <td>2026-10-06</td>
        </tr>
      </table>
      <table>
        <tr>
          <th>P. č.</th>
          <th>Popis</th>
          <th>Množstvo</th>
          <th>MJ</th>
          <th>Jednotková cena</th>
        </tr>
        <tr>
          <td>1</td>
          <td>sdadsad</td>
          <td class="number">3</td>
          <td>ks</td>
          <td class="number">122.00</td>
        </tr>
        <tr>
          <th colspan="4" class="number">Celková cena</th>
          <th class="number">366.00 EUR</th>
        </tr>
      </table>
      <p class="signature">..............................<br>Podpis odberateľa</p>
    </div>
  </body>
</html>
